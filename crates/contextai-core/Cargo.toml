[package]
name = "contextai-core"
version = "0.1.0"
description = "Platform-independent logic of ContextAI: dictionaries, storage, spaced repetition"
edition = "2021"

[dependencies]
ammonia = "4.2.4"
chardetng = "1.0.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8.44"
flate2 = "1.1.10"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.29.0", features = ["v7"] }
whatlang = "0.18"
